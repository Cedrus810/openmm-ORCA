[build-system]
requires = ["setuptools>=77"]  # PEP 639 license string
build-backend = "setuptools.build_meta"

[project]
name = "openmm-orca"
dynamic = ["version"]
description = "OpenMM-driven QM/MM and ONIOM with ORCA (via OPI) as the QM backend"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["OpenMM", "QM/MM", "ONIOM", "ORCA", "molecular-dynamics", "computational-chemistry"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "openmm>=8.5",
    "orca-pi>=2.0",
    "numpy",
]

[project.optional-dependencies]
test = ["pytest>=9"]

[tool.setuptools.dynamic]
version = {attr = "openmmorca.__version__"}  # single source of the version

[tool.setuptools.packages.find]
include = ["openmmorca*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "orca: tests that require a working ORCA installation",
    "slow: tests that take more than about a minute",
]
addopts = "-m 'not slow'"
